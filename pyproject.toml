[project]
name = "meet-scribe"
version = "0.1.0"
description = "Pipeline locale di trascrizione riunioni con speaker diarization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.1.0",
    # PyAV 19 ha rimosso `metadata_errors` da av.open, che faster-whisper 1.2.1
    # passa ancora quando gli si dà un path (TypeError in trascrizione su Colab).
    # transcriber.py ora passa direttamente i campioni e non dipende più da quella
    # chiamata; il limite resta come rete di sicurezza. Toglierlo quando
    # faster-whisper pubblica una versione compatibile con PyAV 19.
    "av<19",
    # CTranslate2 (faster-whisper su GPU) è compilato per CUDA 12 e cerca
    # libcublas.so.12; da ottobre 2026 Colab ha PyTorch con CUDA 13, che porta solo
    # cuBLAS 13. Questo pacchetto fornisce cuBLAS 12, che transcriber.py carica
    # prima di Whisper. Solo Linux: su Windows e macOS non viene installato.
    "nvidia-cublas-cu12; sys_platform == 'linux'",
    "pyannote-audio>=3.3.0,<5.0.0",
    # pyannote 4.x scarica un PLDA da `pyannote/speaker-diarization-community-1`,
    # che HF serve tramite storage Xet. Senza il pacchetto `hf-xet`, huggingface_hub
    # ripiega sul "xet-bridge" (URL CDN firmato) che su Colab da' 403 SignatureError.
    # Installando hf-xet si usa il protocollo Xet nativo, che scarica correttamente.
    "hf-xet>=1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "soundfile>=0.12.0",
    "soundcard>=0.4.6",
    # Floor basso di proposito: su Colab numpy 2.0.2 e' gia' installato e importato
    # all'avvio. Un floor alto (es. >=2.4) forzerebbe pip ad aggiornarlo, e siccome
    # e' gia' importato Colab chiederebbe il "Restart runtime" a ogni prima cella.
    # >=2.0 soddisfa i vincoli reali dell'albero (pyannote-core>=2.0, pandas>=1.26)
    # e lascia pip tenere il numpy gia' presente.
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meet_scribe"]

[tool.uv]
override-dependencies = ["torchcodec==0.0.0; python_version > '9999'"]

[project.scripts]
meet-scribe = "meet_scribe.main:main"
